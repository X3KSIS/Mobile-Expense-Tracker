name: flutter_expensetracker
description: "ExpenseTrack: track income and expenses in Zambian Kwacha."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  go_router: ^18.1.4
  intl: ^0.20.3
  notification_listener_service: ^1.0.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  supabase_flutter: ^2.18.3
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

flutter_native_splash:
  color: "#F7F7F8"
  image: assets/images/splash_logo.png
  android_12:
    color: "#F7F7F8"
    icon_background_color: "#F7F7F8"
    image: assets/images/splash_logo_android12.png
  web: true
  android: true
  ios: true
